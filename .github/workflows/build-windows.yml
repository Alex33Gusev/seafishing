name: Build Sea Fishing for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '4.5.1'
          $base = "https://github.com/godotengine/godot/releases/download/$version-stable"

          function Download-WithRetry($url, $outFile) {
            for ($i = 1; $i -le 5; $i++) {
              try {
                Write-Host "Downloading $url (attempt $i/5)"
                Invoke-WebRequest -Uri $url -OutFile $outFile -UseBasicParsing -TimeoutSec 300
                if ((Get-Item $outFile).Length -gt 1000000) { return }
              } catch {
                Write-Warning $_
              }
              Start-Sleep -Seconds (10 * $i)
            }
            throw "Download failed: $url"
          }

          Download-WithRetry "$base/Godot_v$version-stable_win64.exe.zip" 'godot.zip'
          Expand-Archive godot.zip -DestinationPath godot -Force
          $godot = Get-ChildItem godot -Filter 'Godot_v*.exe' | Select-Object -First 1
          Copy-Item $godot.FullName godot.exe -Force

          Download-WithRetry "$base/Godot_v$version-stable_export_templates.tpz" 'templates.tpz'
          $templateDir = "$env:APPDATA\Godot\export_templates\$version.stable"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          tar -xf templates.tpz -C $templateDir
          if (Test-Path "$templateDir\templates") {
            Copy-Item "$templateDir\templates\*" $templateDir -Recurse -Force
            Remove-Item "$templateDir\templates" -Recurse -Force
          }

      - name: Check project
        shell: pwsh
        run: .\godot.exe --headless --path . --editor --quit

      - name: Export Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          .\godot.exe --headless --path . --export-release 'Windows Desktop' 'build\SeaFishing.exe'

      - name: Package Windows game
        shell: pwsh
        run: Compress-Archive -Path build\* -DestinationPath SeaFishing-Windows.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SeaFishing-Windows
          path: SeaFishing-Windows.zip
          if-no-files-found: error
